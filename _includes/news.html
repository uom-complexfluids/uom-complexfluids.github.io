
<div class="well">
<h4>News</h4>

{% for article in site.data.news limit:9 %}
<p>{{ article.date }}<br>{{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}</p>
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>

</div>

<div class="well">
<h4>Meetings</h4>

{% for meeting in site.data.meetings %}
<p>{{ meeting.date }}<br><em>{{ meeting.name }}</em><br>{{ meeting.location }}</p>
{% endfor %}

</div>
